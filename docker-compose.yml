services:
    db:
        image: postgres:18
        container_name: ai_driving_tutor_db
        restart: unless-stopped

        environment:
            POSTGRES_DB: driving_tutor
            POSTGRES_USER: driving_tutor_user
            POSTGRES_PASSWORD: local_dev_password

        ports:
            - "5433:5432"

        volumes:
            - postgres_data:/var/lib/postgresql

        healthcheck:
            test: [ "CMD-SHELL", "pg_isready -U driving_tutor_user -d driving_tutor" ]
            interval: 5s
            timeout: 5s
            retries: 5

volumes:
    postgres_data:
